[pytest]
testpaths = tests
pythonpath = .
addopts = --browser chromium --tracing retain-on-failure --screenshot only-on-failure
markers =
    p0: core trading flow
    p1: main functionality and key negative paths
    p2: secondary checks
    p3: empty states and low-risk checks
    trading: places, modifies, or closes demo orders; runs only when AQX_ALLOW_TRADING=1
